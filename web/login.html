<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 资源中心</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
    <style>
    .auth-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f4f7fc url("/static/login-bg.svg") center / cover no-repeat;
      position: relative; overflow: hidden;
      padding: 20px;
    }
    .auth-wrap::before {
      content: ""; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(75, 105, 166, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(75, 105, 166, .04) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 88%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 88%);
    }
    .auth-wrap::after {
      content: ""; position: absolute; right: -110px; top: -140px; width: 440px; height: 440px;
      border: 1px solid rgba(82, 116, 190, .09); border-radius: 50%;
      box-shadow: 0 0 0 54px rgba(100, 136, 215, .035), 0 0 0 108px rgba(100, 136, 215, .022);
    }
    .auth-card {
      width: min(400px, 94vw); background: rgba(255,255,255,.96); border: 1px solid rgba(255,255,255,.72);
      border-radius: 20px; padding: 34px 32px 30px; position: relative; z-index: 1;
      box-shadow: 0 24px 64px rgba(45, 65, 105, .16), 0 4px 16px rgba(45, 65, 105, .06), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .auth-logo { text-align: center; margin-bottom: 24px; }
    .auth-logo .icon {
      width: 58px; height: 58px; margin: 0 auto 12px; display: grid; place-items: center;
      border-radius: 17px; background: linear-gradient(145deg, #2e63f6, #6b92ff);
      box-shadow: 0 10px 24px rgba(46,99,246,.28), inset 0 1px 0 rgba(255,255,255,.28);
    }
    .auth-logo .icon svg { width: 34px; height: 34px; }
    .auth-logo h1 { font-size: 22px; margin-top: 0; letter-spacing: -.2px; }
    .auth-logo p { font-size: 13px; color: var(--text-3); margin-top: 4px; }
    .auth-err {
      margin-top: 12px; background: var(--tint-danger); border: 1px solid var(--danger-border); color: var(--danger);
      font-size: 13px; padding: 9px 12px; border-radius: 10px; display: none;
    }
    .auth-hint {
      margin-top: 16px; background: var(--tint-primary); border: 1px solid var(--ring); color: var(--primary);
      font-size: 12.5px; padding: 9px 12px; border-radius: 10px; text-align: center;
    }
    @media (max-width: 520px) {
      .auth-wrap { padding: 16px; background-position: center; }
      .auth-wrap::before { background-size: 36px 36px; }
      .auth-wrap::after { right: -220px; top: -190px; }
      .auth-card { width: 100%; padding: 30px 24px 26px; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="icon" style="color:#fff"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg></div>
        <h1>资源中心</h1>
        <p>多源聚合 · 云端管理</p>
      </div>

      <form id="authForm" autocomplete="on">
        <div class="form-row">
          <label>用户名</label>
          <input class="input" id="username" name="username" placeholder="请输入用户名" required maxlength="32">
        </div>
        <div class="form-row">
          <label>密码</label>
          <input class="input" id="password" name="password" type="password" placeholder="请输入密码" required maxlength="64">
        </div>
        <button class="btn lg" id="submitBtn" type="submit" style="width:100%">登 录</button>
        <div class="auth-err" id="authErr"></div>
      </form>

    </div>
  </div>

  <script>
    "use strict";
    const $ = (s) => document.querySelector(s);

    $("#authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("#submitBtn");
      const errBox = $("#authErr");
      btn.disabled = true;
      btn.textContent = "登录中…";
      errBox.style.display = "none";
      try {
        const res = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: $("#username").value.trim(),
            password: $("#password").value,
          }),
        });
        const body = await res.json().catch(() => ({ msg: "响应解析失败" }));
        if (!res.ok || body.code !== 0) throw new Error(body.msg || "请求失败");
        location.href = "/";
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "登 录";
      }
    });
  </script>
</body>
</html>
